name: build

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  POWERSHELL_TELEMETRY_OPTOUT: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  
jobs:
  prepare:
    runs-on: ubuntu-latest
    
    outputs:
      version_number: ${{ steps.prepared.outputs.version_number }}
      version_suffix: ${{ steps.prepared.outputs.version_suffix }}
      full_version: ${{ steps.prepared.outputs.full_version }}
      short_hash: ${{ steps.prepared.outputs.short_hash }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Prepare version
        id: prepared
        uses: ./.github/actions/prepare-version
        with:
          target_file: "Directory.Build.props"

  build:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}-latest
    timeout-minutes: 60
    needs: prepare
    
    env:
      STAGING_DIR: dist
      PACKAGE_DIR: out

    strategy:
      matrix:
        configuration: [ Release ]
        platform:
          - { name: win-x64,    runner: windows }
          - { name: linux-x64,  runner: ubuntu  }
      fail-fast: false
      
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Build
        uses: ./.github/actions/build-template
        with:
          version_file: 'Directory.Build.props'
          publish_project: src/Hyjinx/Hyjinx.csproj
          runtime_identifier: ${{ matrix.platform.name }}
          staging_dir: ${{ env.STAGING_DIR }}
          version: ${{ needs.prepare.outputs.version_number }}
          version_suffix: ${{ needs.prepare.outputs.version_suffix }}
          short_hash: ${{ needs.prepare.outputs.short_hash }}
          build_opts: --version-suffix "${{ steps.git_short_hash.outputs.result }}" -p:DebugType=portable
          run_tests: true
          test_opts: --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Package
        uses: ./.github/actions/package-template
        with:
          runtime_identifier: ${{ matrix.platform.name }}
          packager: ${{ matrix.platform.runner }}
          version: ${{ needs.prepare.outputs.full_version }}
          staging_dir: ${{ env.STAGING_DIR }}
          package_dir: ${{ env.PACKAGE_DIR }}
          
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform.name }}
          path: "${{ env.PACKAGE_DIR }}/"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.platform.name }}-${{ matrix.configuration }}
          path: TestResults/**/*
          if-no-files-found: error

      - name: Upload coverage report
        uses: codacy/codacy-coverage-reporter-action@6904bd01e29ada115135b5eca20125758ccae53b # master (2026-03-25)
        with:
          project-token: ${{ secrets.CODACY_TOKEN }}
          coverage-reports: TestResults/**/coverage.cobertura.xml
