name: Build
description: Builds the application

inputs:
  publish_project:
    description: "The path to the project file which will be published."
    required: true
  runtime_identifier:
    description: "The target runtime identifier."
    required: true
  version_file:
    description: "The file which will have the version updated."
    required: true
  configuration:
    description: "The build configuration. Eg: Debug or Release"
    required: false
    default: "Release"
  staging_dir:
    description: "The output directory where the published files should be dropped."
    required: true
  version:
    description: "The version which will be used during compilation."
    required: true  
  version_suffix:
    description: "The suffix of the version (if applicable)."
    required: false
  short_hash:
    description: "The short hash of the commit."
    required: false
  run_tests:
    description: "Enables or disables the execution of the unit tests."
    required: false
    default: "false"
  test_opts:
    description: "Additional options to pass to the test runner."
    required: false
  build_opts:
    description: "Additional options to pass to the build command."
    required: false
    
runs:
  using: "composite"
  steps:
    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Update version
      uses: vers-one/dotnet-project-version-updater@v1.7
      with:
        file: "${{ inputs.version_file }}"
        version: ${{ inputs.version }}
        version-property: VersionPrefix
            
    - name: Build
      shell: bash
      run: |
        dotnet build -c "${{ inputs.configuration }}" ${{ inputs.build_opts }}

    - name: Run tests
      if: inputs.run_tests == 'true'
      shell: bash
      run: |
        dotnet test --no-build -c "${{ inputs.configuration }}" ${{ inputs.test_opts }}

    - name: Publish for Preview
      if: inputs.version_suffix != ''
      shell: bash
      run: |
        dotnet publish ${{ inputs.publish_project }} -c "${{ inputs.configuration }}" -r "${{ inputs.runtime_identifier }}" -p:PublishReadyToRun=true -o ${{ inputs.staging_dir }} --self-contained --version-suffix "${{ inputs.version_suffix }}+${{ inputs.short_hash }}"
      
    - name: Publish for Release
      if: inputs.version_suffix == ''
      shell: bash
      run: |
        dotnet publish ${{ inputs.publish_project }} -c "${{ inputs.configuration }}" -r "${{ inputs.runtime_identifier }}" -p:PublishReadyToRun=true -o ${{ inputs.staging_dir }} --self-contained
